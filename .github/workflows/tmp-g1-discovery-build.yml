name: Temporary K G1 Discovery Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore isolated source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kg1"
          cp tmp-g1-discovery-build/source_v3.zip "$RUNNER_TEMP/source.zip"
          echo "Expected source SHA256: 8f0f2ae4a956945cceb0736dddb83e3cf365c47aec6bbb47b3a4f71b0da420f9"
          sha256sum "$RUNNER_TEMP/source.zip"
          echo "8f0f2ae4a956945cceb0736dddb83e3cf365c47aec6bbb47b3a4f71b0da420f9  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/kg1"

      - name: Read-only safety audit
        shell: bash
        working-directory: ${{ runner.temp }}/kg1
        run: |
          chmod +x SAFETY_AUDIT.sh
          ./SAFETY_AUDIT.sh

      - name: Build and lint
        shell: bash
        working-directory: ${{ runner.temp }}/kg1
        run: |
          gradle --no-daemon clean :app:assembleDebug :app:lintDebug

      - name: Verify APK
        shell: bash
        working-directory: ${{ runner.temp }}/kg1
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/K_G1_Discovery_v0_1.apk
          sha256sum out/K_G1_Discovery_v0_1.apk | tee out/SHA256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose out/K_G1_Discovery_v0_1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: K_G1_Discovery_v0_1
          path: |
            ${{ runner.temp }}/kg1/out/K_G1_Discovery_v0_1.apk
            ${{ runner.temp }}/kg1/out/SHA256.txt
            ${{ runner.temp }}/kg1/app/build/reports/lint-results-debug.html
          if-no-files-found: error
